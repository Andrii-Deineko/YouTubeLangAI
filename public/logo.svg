<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B" />
      <stop offset="45%" stop-color="#0F1117" />
      <stop offset="100%" stop-color="#090A0F" />
    </linearGradient>
    <linearGradient id="primaryAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#93C5FD" />
      <stop offset="40%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>
    <linearGradient id="stripesGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A5B4FC" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#6366F1" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Base App Background with soft border -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bgGrad)" stroke="#3730A3" stroke-width="2.5" />

  <!-- Cinema Frame / Clapperboard Body -->
  <g filter="url(#glow)">
    <!-- Main Screen Body -->
    <rect x="20" y="30" width="88" height="68" rx="14" fill="#141522" stroke="#4F46E5" stroke-width="2" />
    
    <!-- Top Clapperboard Slats -->
    <path d="M20 36C20 32.6863 22.6863 30 26 30H102C105.314 30 108 32.6863 108 36V44H20V36Z" fill="#1E1B4B" />
    <!-- Diagonal clapper stripes -->
    <path d="M34 30L27 44H35L42 30H34Z" fill="url(#stripesGrad)" />
    <path d="M52 30L45 44H53L60 30H52Z" fill="url(#stripesGrad)" />
    <path d="M70 30L63 44H71L78 30H70Z" fill="url(#stripesGrad)" />
    <path d="M88 30L81 44H89L96 30H88Z" fill="url(#stripesGrad)" />

    <!-- Center Cinema Play Triangle -->
    <path d="M56 52.5C56 50.8 57.9 49.8 59.3 50.7L75.5 60.2C76.8 61 76.8 63 75.5 63.8L59.3 73.3C57.9 74.2 56 73.2 56 71.5V52.5Z" fill="url(#primaryAccent)" />
    
    <!-- AI Sparkle accent -->
    <path d="M86 49L87.5 52.5L91 54L87.5 55.5L86 59L84.5 55.5L81 54L84.5 52.5L86 49Z" fill="#E0E7FF" />

    <!-- Subtitle Bar 1 (Original / White) -->
    <rect x="34" y="80" width="60" height="5" rx="2.5" fill="#FFFFFF" fill-opacity="0.95" />

    <!-- Subtitle Bar 2 (Translation / Indigo Accent) -->
    <rect x="42" y="88" width="44" height="4" rx="2" fill="#818CF8" fill-opacity="0.95" />
  </g>
</svg>
